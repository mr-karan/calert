version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

builds:
  - binary: calert.bin
    id: calert
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }})"
    dir: ./cmd/

archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - config.sample.toml
      - static/

dockers_v2:
  - id: calert
    ids:
      - calert
    dockerfile: Dockerfile
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}"
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags: ["--pull"]
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files:
      - config.sample.toml
      - static/
  - id: calert-scratch
    ids:
      - calert
    dockerfile: Dockerfile.scratch
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}"
    tags:
      - "{{ .Tag }}-scratch"
      - latest-scratch
    platforms:
      - linux/amd64
      - linux/arm64
    flags: ["--pull"]
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files:
      - config.sample.toml
      - static/
